services:
  - type: web
    name: fastapi-app
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false

  - type: worker
    name: celery-worker
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_config.celery_app worker --loglevel=info
    envVars:
       - key: DATABASE_URL
         sync: false
       - key: REDIS_URL
         sync: false

  - type: worker
    name: celery-beat
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.core.celery_config.celery_app beat --loglevel=info
    envVars:
       - key: DATABASE_URL
         sync: false
       - key: REDIS_URL
         sync: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v3
      - name: Deploy FastAPI
        run: ./deploy.sh
